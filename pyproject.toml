[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pi-branch-out"
version = "0.1.0"
description = "Structured memory-budget branch-out collection and offline RL for Pi + TDAI on RoadmapBench"
requires-python = ">=3.11"
dependencies = [
  "tomlkit>=0.13.2",
]

[project.optional-dependencies]
harbor = ["harbor>=0.1.0"]
training = ["numpy>=1.26"]

[project.scripts]
pi-branch-out = "pi_branch_out.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_branch_out"]
